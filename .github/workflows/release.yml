name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        default: patch
        options: [patch, minor, major]

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          BUMP=${{ github.event.inputs.bump || 'patch' }}
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          if [[ "$BUMP" == "major" ]]; then MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif [[ "$BUMP" == "minor" ]]; then MINOR=$((MINOR+1)); PATCH=0
          else PATCH=$((PATCH+1)); fi
          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "prev=${LATEST}" >> $GITHUB_OUTPUT

      - name: Bump package.json
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.version }}"
          git push

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
          gh release create ${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes-start-tag ${{ steps.version.outputs.prev }}

      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(gh release view ${{ steps.version.outputs.version }} --json body -q .body)
          HEADER="## ${{ steps.version.outputs.version }} ($(date +%Y-%m-%d))"
          ENTRY="${HEADER}\n\n${NOTES}\n\n"
          if [ -f CHANGELOG.md ]; then
            printf '%s' "${ENTRY}" > /tmp/new_entry.md
            cat CHANGELOG.md >> /tmp/new_entry.md
            mv /tmp/new_entry.md CHANGELOG.md
          else
            printf '# Changelog\n\n%s' "${ENTRY}" > CHANGELOG.md
          fi
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for ${{ steps.version.outputs.version }}"
          git push
