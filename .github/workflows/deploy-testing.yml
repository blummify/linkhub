name: Deploy to Testing

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to QA
        required: true
        default: dev

jobs:
  deploy-testing:
    name: Tag for QA deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Create and push QA tag
        run: |
          BRANCH=$(echo "${{ github.event.inputs.branch }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\{2,\}/-/g' \
            | sed 's/^-//;s/-$//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v0.0.0-${BRANCH}-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
